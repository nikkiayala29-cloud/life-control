<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Control</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>🧠 Life Control</h2>

    <button onclick="switchTab('dashboard')">Dashboard</button>
    <button onclick="switchTab('tasks')">Tasks</button>
    <button onclick="switchTab('habits')">Habits</button>
    <button onclick="switchTab('stats')">Stats</button>

    <div class="themeBox">
      <button onclick="toggleTheme()">🌗 Theme</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- TOPBAR -->
    <div class="topbar">
      <h3 id="pageTitle">Dashboard</h3>
      <div class="status">● Online</div>
    </div>

    <!-- DASHBOARD -->
    <section id="dashboard" class="page active fade">
      <div class="grid">

        <div class="card big">
          <h2>Welcome back 👋</h2>
          <p>Your life system is active and synced.</p>
        </div>

        <div class="card">
          <h3>Tasks</h3>
          <p id="taskCount">0</p>
        </div>

        <div class="card">
          <h3>Progress</h3>
          <div class="bar"><div id="progressBar"></div></div>
        </div>

      </div>
    </section>

    <!-- TASKS -->
    <section id="tasks" class="page fade">
      <h2>Tasks</h2>

      <div class="card">
        <input id="taskInput" placeholder="Type task and press Enter">
      </div>

      <div id="taskList"></div>
    </section>

    <!-- HABITS -->
    <section id="habits" class="page fade">
      <h2>Habits</h2>

      <div class="card">
        <p id="habitText">Drink water 💧</p>
        <button onclick="nextHabit()">Next Habit</button>
      </div>
    </section>

    <!-- STATS -->
    <section id="stats" class="page fade">
      <h2>Analytics</h2>

      <div class="card">
        <p>Productivity Score</p>
        <div class="bar"><div id="progressBar2"></div></div>
        <button onclick="increase()">Improve</button>
      </div>
    </section>

  </main>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
