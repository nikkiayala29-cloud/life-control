<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Control</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>🧠 Life Control</h2>

    <button onclick="switchTab('dashboard')">Dashboard</button>
    <button onclick="switchTab('tasks')">Tasks</button>
    <button onclick="switchTab('habits')">Habits</button>
    <button onclick="switchTab('stats')">Stats</button>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- TOPBAR -->
    <div class="topbar">
      <h3 id="pageTitle">Dashboard</h3>
      <button onclick="notify()">🔔 Notify</button>
    </div>

    <!-- DASHBOARD -->
    <section id="dashboard" class="page active">
      <div class="grid">

        <div class="card big">
          <h3>Welcome back 👋</h3>
          <p>Your life control center is active.</p>
        </div>

        <div class="card">
          <h3>Today's Progress</h3>
          <div class="bar"><div id="progressBar"></div></div>
        </div>

        <div class="card">
          <h3>Quick Stats</h3>
          <p id="taskCount">Tasks: 0</p>
        </div>

      </div>
    </section>

    <!-- TASKS -->
    <section id="tasks" class="page">
      <h2>Tasks</h2>

      <div class="card">
        <input id="taskInput" placeholder="Add new task">
        <button onclick="addTask()">Add Task</button>
      </div>

      <div id="taskList"></div>
    </section>

    <!-- HABITS -->
    <section id="habits" class="page">
      <h2>Habits</h2>

      <div class="card">
        <p id="habitText">Drink water 💧</p>
        <button onclick="nextHabit()">Next</button>
      </div>
    </section>

    <!-- STATS -->
    <section id="stats" class="page">
      <h2>Analytics</h2>

      <div class="card">
        <p>Productivity Score</p>
        <div class="bar"><div id="progressBar2"></div></div>
        <button onclick="increase()">Improve</button>
      </div>
    </section>

  </main>

</div>

<!-- NOTIFICATION -->
<div id="toast" class="toast">Action completed</div>

<script src="app.js"></script>
</body>
</html>
