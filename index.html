<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Control</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>🧠 Life Control</h2>

    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('tasks')">Tasks</button>
    <button onclick="showPage('habits')">Habits</button>
    <button onclick="showPage('stats')">Stats</button>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">

    <!-- DASHBOARD -->
    <section id="dashboard" class="page active">
      <h1>Dashboard</h1>
      <div class="card">Welcome back 👋</div>
      <div class="card">Today is your control center.</div>
    </section>

    <!-- TASKS -->
    <section id="tasks" class="page">
      <h1>Tasks</h1>

      <div class="card">
        <input id="taskInput" placeholder="Add task">
        <button onclick="addTask()">Add Task</button>
      </div>

      <ul id="taskList"></ul>
    </section>

    <!-- HABITS -->
    <section id="habits" class="page">
      <h1>Habits</h1>

      <div class="card">
        <p id="habitText">Drink water 💧</p>
        <button onclick="nextHabit()">Next Habit</button>
      </div>
    </section>

    <!-- STATS -->
    <section id="stats" class="page">
      <h1>Stats</h1>

      <div class="card">
        <p>Productivity</p>
        <div class="bar">
          <div id="progress"></div>
        </div>
        <button onclick="increase()">Improve Day</button>
      </div>
    </section>

  </main>

</div>

<script src="app.js"></script>
</body>
</html>
